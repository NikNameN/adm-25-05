<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="АДМ-25-05">
<title>АДМ-25-05</title>
<style>
:root{--bg:#070b14;--card:#141c2c;--card2:#1a2438;--line:rgba(255,255,255,.08);--text:#f2f5fa;--muted:#8b97ab}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 8px) 0 calc(env(safe-area-inset-bottom) + 24px)}
header{padding:8px 16px 10px;position:sticky;top:0;z-index:20;background:rgba(7,11,20,.94);backdrop-filter:blur(16px)}
h1{margin:0;font-size:20px}
.hint{color:var(--muted);font-size:12px;margin-top:3px}
.next{margin:8px 16px 0;padding:12px 14px;border-radius:16px;background:linear-gradient(135deg,#1b3a7a,#163056)}
.next .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9dc0ff}
.next .what{font-size:16px;font-weight:700;margin-top:3px}
.next .when{font-size:13px;color:#c9d8f5;margin-top:2px}
.seg{margin:10px 16px 6px;display:flex;background:var(--card);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;padding:8px;border-radius:10px}
.seg button.on{background:var(--card2);color:var(--text)}
.day{padding:4px 16px}
.day h2{margin:16px 0 8px;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.day.today h2{color:#dbeafe}
.pill{font-size:11px;background:#1d4ed8;color:#fff;border-radius:999px;padding:2px 8px}
.item{background:var(--card);border-radius:16px;padding:12px 13px;margin-bottom:8px;display:flex;gap:12px;border:1px solid var(--line)}
.item.done{opacity:.45}
.stripe{width:4px;border-radius:99px;flex:0 0 4px}
.time{width:64px;flex:0 0 64px;font-variant-numeric:tabular-nums}
.time b{display:block;font-size:14px}
.time span{color:var(--muted);font-size:12px}
.title{font-size:15px;font-weight:650}
.meta{margin-top:3px;font-size:12px;color:var(--muted)}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;margin-right:4px;background:#1e293b;color:#cbd5e1}
.lec{background:#1e3a5f;color:#93c5fd}
.sem{background:#14532d;color:#86efac}
.lab{background:#5b21b6;color:#ddd6fe}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
</style>
</head>
<body>
<header>
  <h1>АДМ-25-05</h1>
  <div class="hint" id="headerHint"></div>
</header>
<div class="next" id="nextBox" hidden></div>
<div class="seg" id="seg">
  <button data-g="all" class="on">Все</button>
  <button data-g="А">Подгруппа А</button>
  <button data-g="Б">Подгруппа Б</button>
</div>
<main id="board"><div class="empty">Загрузка…</div></main>
<script>
const SHORT=["Аналитика данных","Сенсоры роботов","Управление проектом","ПО мехатронных систем","Инструменты моделирования","Навигация АМР","Стоимостной инжиниринг"];
const COLORS=["#3b82f6","#8b5cf6","#10b981","#ef4444","#f59e0b","#06b6d4","#94a3b8"];
const TNAMES=["Лекция","Семинар","Лабораторная"];
let group=localStorage.getItem("adm2505_group")||"all";
function isoToday(){const n=new Date();return new Date(n-n.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function parseLocal(iso){return new Date(iso+"T12:00:00")}
function fmtDay(iso){return parseLocal(iso).toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"})}
function fmtShort(iso){return parseLocal(iso).toLocaleDateString("ru-RU",{day:"numeric",month:"short"})}
const today=isoToday();
document.getElementById("headerHint").textContent="сегодня "+fmtDay(today);
document.getElementById("seg").onclick=e=>{const b=e.target.closest("button");if(!b)return;group=b.dataset.g;localStorage.setItem("adm2505_group",group);if(window._ev)render(window._ev)};
function badgeType(t){return t==="Лекция"?"lec":t==="Семинар"?"sem":"lab"}
function startAt(e){return new Date(e.date+"T"+e.start+":00").getTime()}
function endAt(e){return new Date(e.date+"T"+e.end+":00").getTime()}
function render(EVENTS){
  [...document.querySelectorAll("#seg button")].forEach(b=>b.classList.toggle("on",b.dataset.g===group));
  const all=EVENTS.filter(e=>!e.group||group==="all"||e.group===group).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
  const list=all.filter(e=>e.date>=today);
  const n=all.filter(e=>endAt(e)>=Date.now()-300000).sort((a,b)=>startAt(a)-startAt(b))[0];
  const box=document.getElementById("nextBox");
  if(!n){box.hidden=true}else{box.hidden=false;const when=n.date===today?("сегодня "+n.start):(fmtShort(n.date)+", "+n.start);box.innerHTML=`<div class="lbl">ближайшая пара</div><div class="what">${SHORT[n.si]}</div><div class="when">${when}–${n.end} · ${n.type}${n.group?" · гр. "+n.group:""}</div>`}
  const board=document.getElementById("board");
  if(!list.length){board.innerHTML='<div class="empty">Дальше пар нет</div>';return}
  let html="";
  for(const d of [...new Set(list.map(e=>e.date))]){
    html+=`<section class="day${d===today?" today":""}"><h2>${fmtDay(d)}${d===today?'<span class="pill">сегодня</span>':""}</h2>`;
    for(const e of list.filter(x=>x.date===d)){
      html+=`<article class="item${endAt(e)<Date.now()?" done":""}"><div class="stripe" style="background:${COLORS[e.si]}"></div><div class="time"><b>${e.start}</b><span>${e.end}</span></div><div><div class="title">${SHORT[e.si]}</div><div class="meta"><span class="badge ${badgeType(e.type)}">${e.type}</span>${e.group?`<span class="badge">гр. ${e.group}</span>`:""}${e.teacher||""}</div></div></article>`;
    }
    html+="</section>";
  }
  board.innerHTML=html;
}
Promise.all([
  fetch("./events.json").then(r=>r.ok?r.json():{e:[]}).catch(()=>({e:[]})),
  fetch("./events-a.json").then(r=>r.ok?r.json():{e:[]}).catch(()=>({e:[]})),
  fetch("./events-b.json").then(r=>r.ok?r.json():{e:[]}).catch(()=>({e:[]}))
]).then(packs=>{
  const e=[].concat(...packs.map(p=>p.e||[]));
  const map={};
  for(const row of e){map[row.join("|")]=row}
  const EVENTS=Object.values(map).map(r=>({date:r[0],start:r[1],end:r[2],si:r[3],type:TNAMES[r[4]],teacher:r[5],group:r[6],day:r[8]}));
  window._ev=EVENTS;
  render(EVENTS);
});
</script>
</body>
</html>
